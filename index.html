<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wisdom Games</title>
  <meta name="description" content="Wisdom Games — makers of Traffic Escape Puzzle.">
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0;
      font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(#1b2559, #0e1330) fixed;
      color: #fff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      box-sizing: border-box;
    }
    main { max-width: 560px; width: 100%; }
    h1 { font-size: 2rem; margin: 0 0 4px; letter-spacing: 0.5px; }
    .tag { color: #ffb300; font-weight: 600; margin: 0 0 24px; }
    .card {
      background: rgba(34, 43, 92, 0.85);
      border-radius: 16px;
      padding: 20px 24px;
      margin-bottom: 16px;
    }
    h2 { font-size: 1.15rem; margin: 0 0 8px; }
    p { margin: 0 0 8px; color: rgba(255, 255, 255, 0.8); }
    a { color: #ffb300; }
    .btn {
      display: inline-block;
      background: #ffb300;
      color: #0e1330;
      font-weight: 700;
      text-decoration: none;
      padding: 10px 18px;
      border-radius: 10px;
      margin: 8px 0;
    }
    footer { font-size: 0.85rem; color: rgba(255, 255, 255, 0.5); margin-top: 24px; }
  </style>
</head>
<body>
  <main>
    <h1>Wisdom Games</h1>
    <p class="tag">Independent mobile games</p>

    <section class="card">
      <h2>Traffic Escape Puzzle</h2>
      <p>Slide the cars, clear the lane and drive the red car out. 500 hand-checked
        levels, playable fully offline.</p>
      <p><a class="btn" href="https://play.google.com/store/apps/details?id=com.wisdomgames.traffic_escape">Get it on Google Play</a></p>
      <p><a href="https://qhristec.blogspot.com/2026/09/privacy-policy.html">Privacy policy</a></p>
    </section>

    <section class="card">
      <h2>Contact</h2>
      <p>Christopher Akyea — <a href="mailto:christakyea123@gmail.com">christakyea123@gmail.com</a></p>
    </section>

    <footer>&copy; 2026 Wisdom Games</footer>
  </main>
</body>
</html>
